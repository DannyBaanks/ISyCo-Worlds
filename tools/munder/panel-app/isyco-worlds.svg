<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img" aria-labelledby="title">
  <title id="title">Planeta pixel art de ISyCo Worlds</title>
  <!-- Little night sky tile, framed like a tiny game-world badge. -->
  <path fill="#071714" stroke="#a8e66a" stroke-width="2" d="M12 2h40v4h6v6h4v40h-4v6h-6v4H12v-4H6v-6H2V12h4V6h6z"/>
  <path fill="#102a31" d="M10 10h44v44H10z"/>
  <path fill="#173b3a" d="M12 12h40v2H12zm0 38h40v2H12zM12 16h2v30h-2zm38 0h2v30h-2z"/>
  <!-- Pixel stars and a small moon give the planet a real backdrop. -->
  <path fill="#e8c86f" d="M15 17h2v2h-2zm31 5h2v2h-2zM17 43h2v2h-2zM44 45h2v2h-2z"/>
  <path fill="#63d9d3" d="M24 12h2v4h-2zm-2 2h6v2h-6zm20 34h2v3h-2z"/>
  <path fill="#a8e66a" d="M45 13h5v2h2v5h-2v2h-5v-2h-2v-5h2z"/>
  <path fill="#102a31" d="M45 16h2v2h-2z"/>
  <!-- Stepped orbital ring behind the globe. -->
  <path fill="#e8c86f" d="M9 34h5v-2h6v-2h6v-2h16v2h6v2h5v2h3v6h-4v2h-7v2h-8v-2h-8v-2h-7v-2h-7v-2h-6z"/>
  <path fill="#102a31" d="M11 35h5v-2h6v-2h6v-1h12v1h6v2h5v2h3v4h-5v2h-7v1h-7v-2h-8v-2h-7v-2h-6z"/>
  <!-- Ocean sphere with blocky green continents and bright polar tiles. -->
  <path fill="#063b49" d="M27 13h10v2h5v4h3v5h2v12h-2v5h-3v4h-5v2H27v-2h-5v-4h-3v-5h-2V25h2v-5h3v-4h5z"/>
  <path fill="#258c91" d="M27 15h10v2h5v4h3v5h2v10h-2v5h-3v4h-5v2H27v-2h-5v-4h-3V25h2v-5h3v-3h3z"/>
  <path fill="#63d9d3" d="M23 19h5v2h-2v3h-3v3h-2v-6h2zm14 13h5v3h-2v3h-4v2h-3v-3h2v-3h2zm-12 9h4v2h-4z"/>
  <path fill="#a8e66a" d="M29 19h4v2h-2v3h-4v2h-3v-3h2v-2h3zm10 5h4v3h-2v3h-4v2h-3v-4h2v-2h3zm-13 9h4v2h2v3h-5v-2h-3v-2h2z"/>
  <path fill="#3f754c" d="M30 21h2v2h-2zm10 5h2v2h-2zm-13 8h2v2h-2z"/>
  <path fill="#d8f09a" d="M26 16h4v2h-4zm10 25h3v2h-3z"/>
  <!-- Foreground pixels make the orbit visibly wrap around the planet. -->
  <path fill="#e8c86f" d="M10 37h7v2h6v2h7v2h8v2h6v2h-8v-2h-8v-2h-7v-2h-6v-2h-5z"/>
  <path fill="#fff0aa" d="M12 37h5v2h-5zm34 8h5v2h-5z"/>
</svg>
