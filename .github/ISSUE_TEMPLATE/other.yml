name: Something else
description: Anything that is not a bug report or a feature request.
title: "[Other]: "
body:
  - type: markdown
    attributes:
      value: |
        Blank issues are turned off, so this is the catch-all. If it is a bug or a
        feature request, please back out and pick that template instead: they ask for
        the details that make the report actionable.

        For questions and ideas, open an
        [ISyCo Worlds issue](https://github.com/DannyBaanks/ISyCo-Worlds/issues).
        For security reports, use the private
        [security advisory](https://github.com/DannyBaanks/ISyCo-Worlds/security/advisories/new)
        form rather than a public issue.
  - type: textarea
    id: details
    attributes:
      label: What is this about?
      description: Give us enough context to act on it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ISyCo Worlds version (if relevant)
      placeholder: "0.5.2-ISyCo.2"
    validations:
      required: false
